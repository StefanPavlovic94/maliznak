<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" role="img" aria-labelledby="title desc">
  <title id="title">Pozivnica za poseban trenutak</title>
  <desc id="desc">Ilustracija u boji slonovače i vina, sa pozivnicom, kovertom i zlatnim detaljem.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e7d9ca"/><stop offset="1" stop-color="#d4c1ad"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f0e9dd"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="17" stdDeviation="16" flood-color="#403126" flood-opacity=".2"/></filter>
  </defs>
  <rect width="800" height="860" fill="url(#bg)"/>
  <path d="M0 640c180-74 388-17 800-149v369H0z" fill="#cdbca9" opacity=".33"/>
  <g filter="url(#shadow)" transform="rotate(-10 334 445)">
    <rect x="119" y="196" width="439" height="530" rx="3" fill="#742f3e"/>
    <path d="m119 196 219 169 220-169v530H119z" fill="#8d4550"/>
    <path d="m119 726 219-242 220 242" fill="#70303f"/>
    <circle cx="339" cy="456" r="49" fill="#ddc59c"/>
    <text x="339" y="470" text-anchor="middle" fill="#6c303d" font-family="Georgia,serif" font-size="31" font-style="italic">M</text>
  </g>
  <g filter="url(#shadow)" transform="rotate(7 461 392)">
    <rect x="336" y="149" width="346" height="501" fill="url(#card)"/>
    <rect x="354" y="167" width="310" height="465" fill="none" stroke="#aa8a62" stroke-width=".8"/>
    <path d="M510 207c-20-26-52 2 0 39 52-37 20-65 0-39Zm0-13v16m-16-2 16 11m17-12-17 11" fill="none" stroke="#a97a60" stroke-width="1.4" stroke-linecap="round"/>
    <text x="510" y="312" text-anchor="middle" fill="#663342" font-family="Georgia,serif" font-size="20" font-style="italic">Pozivamo vas</text>
    <text x="510" y="347" text-anchor="middle" fill="#663342" font-family="Georgia,serif" font-size="26">na naše venčanje</text>
    <path d="M447 370h126" stroke="#bd9b6b" stroke-width=".8"/>
    <text x="510" y="411" text-anchor="middle" fill="#84796d" font-family="Georgia,serif" font-size="12" letter-spacing="1">ANA  &amp;  MARKO</text>
    <text x="510" y="466" text-anchor="middle" fill="#82786c" font-family="Georgia,serif" font-size="11">u subotu, osmog juna</text>
    <text x="510" y="487" text-anchor="middle" fill="#82786c" font-family="Georgia,serif" font-size="11">u pet sati popodne</text>
    <text x="510" y="540" text-anchor="middle" fill="#9c7e5d" font-family="Georgia,serif" font-size="9" letter-spacing="2">LJUBAV SE SLAVI ZAJEDNO</text>
  </g>
  <path d="M76 131c34-28 55-32 88-31m-45 26c-4-28 2-42 19-61m-5 60c28-9 42-7 58 5" fill="none" stroke="#7b876f" stroke-width="2" stroke-linecap="round"/>
</svg>
